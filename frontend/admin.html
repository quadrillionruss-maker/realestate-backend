<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Archta — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ADMIN DASHBOARD — completely standalone.

  Deliberately shares nothing with the operator app (realestate.css/js) or
  the buyer portal (portal.html/js): its own markup, its own styles
  (admin.css), its own admin.js. This page has visibility across every
  workspace on the platform at once — reusing a component library built
  around "one authenticated org" would be the wrong abstraction, and a bug
  in shared CSS here would be a bug that touches the one screen with the
  widest blast radius in the whole product.

  admin.css is an EXTERNAL file, not an inline <style> block — it used to
  be inline, which worked through server.js (helmet's CSP there allows
  'unsafe-inline' for styles) but rendered completely unstyled through
  Vercel: frontend/vercel.json's own CSP has no 'unsafe-inline' for
  style-src, so the browser silently dropped the whole block there. See
  admin.css's own header for the rest of that story.

  Auth is a single shared secret (ADMIN_SECRET), not a user session: there is
  no login-as-a-person here, only "does the caller know the operator
  secret". admin.js stores it in sessionStorage (not localStorage — it should
  not outlive the tab) and sends it as `Authorization: Bearer <secret>` on
  every request to /api/admin/*.
-->
<link rel="stylesheet" href="./admin.css">
</head>
<body>

<div id="login-screen">
  <form class="login-card" id="login-form" novalidate>
    <h1>Archta Admin</h1>
    <p>Platform operator access. Not a user account.</p>
    <input type="password" id="login-secret" placeholder="Admin secret" autocomplete="off" autofocus>
    <button type="submit">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<div id="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">ARCHTA ADMIN</div>
    <nav id="nav">
      <button data-section="overview" class="is-active">Overview</button>
      <button data-section="workspaces">Workspaces</button>
      <button data-section="users">Users</button>
      <button data-section="agents">Agents</button>
      <button data-section="notifications">Notifications</button>
      <button data-section="health">Health</button>
      <button data-section="revenue">Revenue</button>
      <button data-section="usage">Usage</button>
    </nav>
  </aside>
  <main class="main" id="view"></main>
</div>

<div class="toast-host" id="toasts"></div>
<div id="overlay"></div>

<!-- Sets window.__API_BASE__ — the one place the backend's real host is
     hardcoded (config.js's own header). This page loads it too rather than
     re-deriving the same answer a second, and differently, in admin.js:
     the frontend and the API are two separate deployments (Vercel and
     Render), so "same origin as this page" is only ever true in local dev,
     never in production. -->
<script src="./config.js"></script>
<script src="./admin.js"></script>
</body>
</html>
