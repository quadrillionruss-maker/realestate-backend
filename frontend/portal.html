<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1E4F63">
  <!-- A personal link. Keep it out of search results and out of the referrer
       header when the buyer clicks through to Paystack. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your payment account</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E4F63'/%3E%3Cpath d='M16 7l7 9-7 9-7-9z' fill='%23c9a45c'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <!-- Same three faces as index.html: Public Sans for the UI, Archivo Black
       for the portal's own greeting headline, IBM Plex Mono for money. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./realestate.css">

  <script src="./config.js"></script>
</head>

<!-- ══ THE BUYER'S OWN VIEW ═══════════════════════════════════════════════
     Three questions, answered without a phone call:
       how much have I paid so far?
       when is my next installment?
       can I get a copy of my allocation letter?

     Deliberately not the operator app. Same typography and palette so it is
     recognisably the same company, but one column, larger type, no sidebar
     and no navigation — a buyer opens this twice a year on a phone.

     The access token arrives in the URL FRAGMENT, not the query string: a
     fragment is never sent to a server, so the link cannot leak through
     access logs or a referrer header. -->
<body class="portal-body">

<div class="portal-wrap">

  <header class="portal-header">
    <span class="portal-mark">◆</span>
    <span class="portal-brand" id="developer-name">Your account</span>
    <!-- SECTION 10 — display currency only; every actual payment still
         transacts in NGN regardless of what is selected here. Hidden until
         portal.js has rates to show (no point offering a toggle with
         nothing to convert with). -->
    <select id="currency-select" class="currency-select hidden" aria-label="Display currency">
      <option value="NGN">₦ NGN</option>
      <option value="USD">$ USD</option>
      <option value="GBP">£ GBP</option>
      <option value="EUR">€ EUR</option>
      <option value="CAD">CA$ CAD</option>
    </select>
  </header>

  <div id="portal-view">
    <div class="skeleton portal-skeleton-title"></div>
    <div class="skeleton portal-skeleton-line-1"></div>
    <div class="skeleton portal-skeleton-line-2"></div>
  </div>

  <footer class="portal-footer" id="portal-foot"></footer>
</div>

<div class="toasts" id="toasts"></div>
<div id="overlay"></div>

<script src="./portal.js"></script>
</body>
</html>
