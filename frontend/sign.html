<!-- ══ SECTION 8 — e-signature ═════════════════════════════════════════════
     The buyer's other standalone page, alongside portal.html: one document,
     read it, sign it, done. The token arrives in the URL fragment for the
     same reason portal.js's does — never sent to a server, never in an
     access log or a Referer header. -->
<body class="portal-body">

<div class="portal-wrap">

  <header class="portal-header">
    <span class="portal-mark">◆</span>
    <span class="portal-brand">Sign your document</span>
  </header>

  <div id="sign-view">
    <div class="skeleton portal-skeleton-title"></div>
    <div class="skeleton portal-skeleton-line-1"></div>
    <div class="skeleton portal-skeleton-line-2"></div>
  </div>

  <footer class="portal-footer">This link is personal to you — please do not forward it.</footer>
</div>

<div class="toasts" id="toasts"></div>

<script src="./sign.js"></script>
</body>
