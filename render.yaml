# Render blueprint. Committing this means the service's configuration is
# reviewable in git rather than living only in a dashboard.
#
# Two things worth knowing before deploying:
#
# 1. ROOT DIRECTORY. If this repo contains other projects, set the service's
#    root directory to the folder holding this file, or Render will build the
#    wrong tree and fail with "Cannot find module".
#
# 2. PDF RENDERING. Allocation letters and receipts render with headless
#    Chromium via puppeteer-core + @sparticuz/chromium — a Chromium build
#    compiled for exactly this kind of constrained Linux environment, so no
#    separate install step or cache directory is needed and no ~300MB browser
#    download happens at build time. This is chosen automatically by platform
#    (src/services/pdfAdapter.js); PDF_ENGINE=core|full overrides it if you
#    ever need to force one path while diagnosing a deploy. If rendering ever
#    does fail, PDF generation is the one thing affected — payments are still
#    recorded and the buyer is still emailed (set RE_AUTO_RECEIPTS=false to
#    stop retrying receipts specifically).
#
# 3. THE PAYSTACK WEBHOOK. Point Paystack at
#    https://<your-service>.onrender.com/api/webhooks/paystack
#    Without it, online payments never settle the installment schedule and
#    staff have to record every card payment by hand.

services:
  - type: web
    name: realestate-sales-ops-api
    runtime: node
    plan: starter
    # --omit=dev keeps the schema test's in-process Postgres, AND full
    # `puppeteer` (a devDependency — see package.json), out of the deploy.
    # Production renders through puppeteer-core + @sparticuz/chromium instead,
    # which needs no separate cache directory or install step.
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # The frontend is deployed separately on Vercel (see CLAUDE.md's
      # "Layout" and "Deployment" sections) — Vercel's config carries the
      # security headers (frontend/vercel.json) this API process's own static
      # serving does not. Left unset this defaults true and this process
      # mounts a second, independently-drifting copy of the frontend with
      # none of those headers.
      - key: SERVE_FRONTEND
        value: "false"

      # Set these in the dashboard (or a secret group) — never in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Where the browser app lives. Password-reset and buyer-portal links are
      # built from this, and both point at the wrong place without it.
      - key: APP_URL
        sync: false

      # Optional. Absent → no Google button, no third-party script loaded.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Optional. Absent → notifications are recorded as 'skipped' rather than
      # failing the request that triggered them.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: TERMII_API_KEY
        sync: false
